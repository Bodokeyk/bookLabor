<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookLabor</title>
    <script src="javas.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Body-Holder">
        <div class="Header-Holder">
            <div class="Main-title">
                <p>Libraries</p>
                <span>
                    <button class="button-AddBook">Add Book</button>
                </span>
            </div>
        </div>
        <div class="Content-Holder">
            <!-- dialog box -->
            <dialog id="alert-dialog">
                <button class="cancel-button dialog-cancel-button">X</button>
                <h3>Book Information</h3>
                <p>Please fill all the blanks</p>
                <form id="form-Data">
                    <label for="bookUrl">Book genre
                        <select id="bookUrl" name="bookUrl" required >
                            <option disabled selected value> -- select an option -- </option>
                            <option value="Books images/fantasyBook.png">Fantasy</option>
                            <option value="Books images/loveBook.png">Love</option>
                            <option value="Books images/misteryBook.png">Mistery</option>
                            <option value="Books images/scienceBook.png">scientific</option>
                            <option value="Books images/noBook.png">Other</option>
                        </select>
                    </label>
                    <label for="bookName">Name of book
                        <input type="text" id="bookName" name="bookName" required>
                    </label>
                    <label for="bookPages">Number of pages
                        <input type="number" id="bookPages" name="bookPages" required>
                    </label>
                    <label for="bookRead">Have you already read this book?
                        <input type="checkbox" id="bookRead" name="bookRead">
                    </label>
                  <button type="submit" formmethod="dialog" class="form-button form-submit">
                    Ok!</button>
                  <input type="reset" class="form-button">
                </form>
              </dialog>


            <div class="NavBar-Holder">
                <div class="Book-Holder Java-Object">
                        <img src="Books images/book-2-svgrepo-com.svg" alt="image of book">
                        <p></p>
                        <p></p>
                        <p></p>      
                    </div>
            </div>
            <div class="Grid-Holder">
                <!-- <div class="Book-Object Java-Object">
                        <button class="cancel-button bookObject-cancel-button">X</button>
                        <img src="" alt="image of book">
                        <p></p>
                        <p></p>
                        <p></p>
                </div> -->
            </div>
        </div>
        <div class="Footer-Holder">
            <p>The Odin Project 2025 by Ahagonkey   </p>
            <p><a href="https://www.vecteezy.com/free-png/book">  -Book PNGs by Vecteezy</a></p>
        </div>

    </div>
</body>
